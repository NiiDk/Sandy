</script><script>'use strict';

function validate(v){if(!v||v.version!==1)throw Error('Unrecognised backup');const n=empty();for(const k of ['done','checks','answers','notes','kit','bridal']){if(!v[k]||typeof v[k]!=='object'||Array.isArray(v[k]))throw Error('Invalid backup');}for(const l of LESSONS){if(v.done[l.id]===true)n.done[l.id]=true;if(typeof v.notes[l.id]==='string')n.notes[l.id]=v.notes[l.id].slice(0,10000);if(Number.isInteger(v.answers[l.id])&&v.answers[l.id]>=0&&v.answers[l.id]<l.answers.length)n.answers[l.id]=v.answers[l.id];for(let i=0;i<3;i++){const key=l.id+'-'+i;if(v.checks[key]===true)n.checks[key]=true;}}for(const k of KIT){if(v.kit[k]===true)n.kit[k]=true;}for(const k of Object.keys(FIELDS)){if(typeof v.bridal[k]==='string')n.bridal[k]=v.bridal[k].slice(0,10000);}return n;}
const KIT=['Wig block and secure stand','Tail comb and sectioning clips','Fibre-appropriate detangling brush','Measuring tape, wig cap and band','Tool cleaner, clean towel and storage','Temperature-controlled hot tools','Fibre-appropriate heat protectant','Elastics, U-pins and setting clips','Suitable shampoo and conditioner','Adhesive and its compatible remover','Optional padding, hairnet and accessories'];
const FIELDS={look:'Chosen look and reference',hair:'Wig fibre, length, density and cap',occasion:'Ceremony, outfit and weather plan',fit:'Fit, comfort and product checks',accessories:'Veil and accessory placement',timing:'Trial date, styling time and touch-ups',aftercare:'Removal and aftercare plan',review:'Trial result and changes to make'};
try{const saved=localStorage.getItem(KEY);if(saved)state=validate(JSON.parse(saved));}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;notify('Browser saving is unavailable. Back up your progress before closing.');}}
function notify(t){$('#notice').textContent=t;$('#notice').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#notice').classList.remove('show'),4000);}
const completed=()=>LESSONS.filter(l=>state.done[l.id]).length;
function card(l){return `<article class="card"><a class="card-image" href="#lesson/${l.id}" tabindex="-1" aria-hidden="true">${l.thumbnail?`<img src="${esc(l.thumbnail)}" alt="" loading="lazy">`:''}<span class="number">${String(l.number).padStart(2,'0')}</span></a><div class="card-body"><div><span class="badge ${state.done[l.id]?'done':''}">${state.done[l.id]?'Practised ✓':esc(l.group)}</span></div><h3 style="margin-top:13px">${esc(l.title)}</h3><p>${esc(l.creator)} · Selected YouTube lesson</p><a class="button quiet" href="#lesson/${l.id}">Open lesson <span aria-hidden="true">→</span></a></div></article>`;}
function cards(){const list=LESSONS.filter(l=>(group==='All'||l.group===group)&&(status==='all'||(status==='done'?!!state.done[l.id]:!state.done[l.id]))&&[l.title,l.hair,l.tools.join(' '),l.creator].join(' ').toLowerCase().includes(query.toLowerCase()));$('#results').textContent=`${list.length} of ${LESSONS.length} lessons`;$('#lesson-grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><h3>No lessons match</h3><p>Try a different style, group or progress filter.</p><button id="clear-filter" class="quiet">Clear filters</button></div>';$('#clear-filter')?.addEventListener('click',()=>{query='';group='All';status='all';render();});}
function learn(){const next=LESSONS.find(l=>!state.done[l.id])||LESSONS[0];return `<section class="hero"><div><p class="eyebrow">Your learning space · Ghana · 2026 edition</p><h1>Beautiful hair.<br>A skill at a time.</h1><p class="muted">Sandy, start with a secure fit. Build your finishing skills. Then bring it all together for the bride.</p><div class="actions"><a class="button" href="#lesson/${next.id}">${completed()?'Continue practising':'Start with your kit'} →</a>${ext(PLAYLIST,'YouTube playlist','button quiet')}</div></div><div class="panel"><div class="row"><div><span class="eyebrow">Your progress</span><span class="metric">${completed()} <span class="muted" style="font-size:23px">/ ${LESSONS.length}</span></span></div><span class="badge">At your own pace</span></div><div class="progress" role="progressbar" aria-label="Lessons practised" aria-valuenow="${completed()}" aria-valuemin="0" aria-valuemax="${LESSONS.length}"><span style="width:${completed()/LESSONS.length*100}%"></span></div><p class="small">Watch → practise → photograph → repeat.<br>Tick “Practised” when you have tried the skill.</p></div></section><div class="path"><span>01 · Prepare</span><span>02 · Fit & install</span><span>03 · Style</span><span>04 · Bridal finish</span></div><div class="section-head"><h2>Your lesson library</h2><p class="muted">One selected video, a short guide and a practical task in every lesson.</p></div><div class="toolbar"><label class="visually-hidden" for="search">Search lessons</label><input id="search" type="search" placeholder="Find a style, tool or hair type…" value="${esc(query)}"><label class="visually-hidden" for="group">Lesson group</label><select id="group">${['All','Foundation','Installation','Everyday','Bridal','Care'].map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select><label class="visually-hidden" for="status">Progress filter</label><select id="status"><option value="all">All progress</option><option value="todo" ${status==='todo'?'selected':''}>To practise</option><option value="done" ${status==='done'?'selected':''}>Practised</option></select></div><p id="results" class="small" role="status"></p><div class="grid" id="lesson-grid"></div><details><summary>Why these styles for Ghana and 2026?</summary><p>Accra salon menus offer frontal/closure installation, wig maintenance, half-up styles and ponytails. These are useful local service signals. Low chignons, waves, soft updos, sculptural buns, French twists and bobs are our bridal practice shortlist, informed by international 2026 trend coverage.</p><p>These are learning priorities, not a verified ranking of Ghanaian bookings. Ask local brides and salons which looks they request before buying a large kit. <a href="#sources">See the sources.</a></p></details>`;}
function lesson(l){return `<p class="small"><a href="#learn">← All lessons</a> &nbsp; / &nbsp; ${l.number} of ${LESSONS.length} · ${esc(l.group)}</p><div class="detail"><section><p class="eyebrow">Lesson ${String(l.number).padStart(2,'0')}</p><h1>${esc(l.title)}</h1><a class="video-link" href="https://www.youtube.com/watch?v=${l.video}" target="_blank" rel="noopener noreferrer" aria-label="Watch ${esc(l.videoTitle)} on YouTube">${l.thumbnail?`<img src="${esc(l.thumbnail)}" alt="Tutorial preview from ${esc(l.creator)}">`:''}<div class="play"><span>▶ Watch on YouTube</span></div></a><p class="small"><strong>${esc(l.creator)}</strong><br>${esc(l.videoTitle)}</p><div class="panel"><h2>Try it in three steps</h2><ul class="checklist">${l.steps.map((s,i)=>`<li><label><input type="checkbox" data-step="${l.id}-${i}" ${state.checks[l.id+'-'+i]?'checked':''}> <span>${i+1}. ${esc(s)}</span></label></li>`).join('')}</ul><hr class="rule"><h3>Your practice task</h3><p>${esc(l.practice)}</p><p class="small">Take front, left, right and back photos. Check comfort, neatness, secure hold and visible lace or tracks. Repeat after correcting one issue.</p><label class="completed-line"><input id="done" type="checkbox" ${state.done[l.id]?'checked':''}> I have practised this lesson</label></div><div class="panel quiz"><h2>Quick check</h2><form id="quiz"><fieldset><legend>${esc(l.question)}</legend>${l.answers.map((a,i)=>`<label><input type="radio" name="answer" value="${i}" ${state.answers[l.id]===i?'checked':''}>${esc(a)}</label>`).join('')}</fieldset><button style="margin-top:12px" type="submit">Check answer</button></form><div id="feedback" aria-live="polite"></div></div></section><aside><div class="panel"><p class="eyebrow">Before you begin</p><h3>Hair to use</h3><p>${esc(l.hair)}</p><h3>Tools & products</h3><ul>${l.tools.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="note">${esc(l.note)}</p><a class="small" href="#kit">Open the hair & tools guide →</a></div><div class="panel"><label for="notes">My practice notes <span id="note-saved" class="saved"></span></label><p class="small">What worked? What needs improving? Add your own photo filenames if helpful.</p><textarea id="notes" maxlength="10000" placeholder="One thing I learned… One thing I will change…">${esc(state.notes[l.id]||'')}</textarea><p class="small">Saved in this browser. Use “Back up progress” to keep a copy or move devices.</p></div><div class="actions">${l.number>1?`<a class="button quiet" href="#lesson/${LESSONS[l.number-2].id}">← Previous</a>`:''}${l.number<LESSONS.length?`<a class="button" href="#lesson/${LESSONS[l.number].id}">Next lesson →</a>`:'<a class="button" href="#bridal">Plan your trial →</a>'}</div></aside></div>`;}
function feedback(l){const a=state.answers[l.id];if(a===undefined)return;$('#feedback').className='feedback '+(a===l.correct?'correct':'');$('#feedback').textContent=(a===l.correct?'Correct. ':'Try again. ')+l.note;}
function kit(){return `<div class="intro"><p class="eyebrow">Know your materials</p><h1>The right hair. The right tools.</h1><p class="muted">Check the fibre, care label, cap coverage, length and density before choosing a technique. A brand name or “blend” label alone is not enough.</p></div><div class="table-wrap"><table><thead><tr><th>Hair type</th><th>Best starting approach</th><th>Heat & care</th></tr></thead><tbody><tr><th>Human hair</th><td>Useful for repeated styling practice. Match processing and density to the look.</td><td>Use permitted heat settings, suitable protection and human-hair care. Processed hair may behave differently.</td></tr><tr><th>Human/synthetic blend</th><td>Use only techniques supported by its exact fibre mix and construction.</td><td>Not automatically heat-safe. Follow the maker’s temperature and product guidance.</td></tr><tr><th>Heat-friendly synthetic</th><td>Can be reshaped within the maker’s instructions; fibre may need cooling in position.</td><td>Use only the specified heat range and fibre-specific products.</td></tr><tr><th>Ordinary synthetic</th><td>Choose a ready-styled straight, bob or curly unit; practise heat-free pinning.</td><td>No hot tools unless explicitly permitted. Use synthetic-fibre care.</td></tr></tbody></table></div><div class="split" style="margin-top:28px"><div class="panel"><h2>My kit checklist</h2><p class="small">Start with the basics. Add specialist tools when the lesson needs them.</p><ul class="checklist">${KIT.map((k,i)=>`<li><label><input type="checkbox" data-kit="${i}" ${state.kit[k]?'checked':''}>${esc(k)}</label></li>`).join('')}</ul></div><div><div class="panel"><h2>Removal belongs in the plan</h2><ol><li>Identify the adhesive and obtain its compatible remover before installation.</li><li>Follow the product label, including contact time and patch-test instructions. Keep products away from the eyes.</li><li>Release the bond gradually. Never pull a bonded lace edge or use force if it resists.</li><li>Remove residue and cleanse the unit and skin as directed. Stop if irritation develops.</li></ol><p class="small">Practise fitting and removal under an experienced stylist’s supervision before offering bonded installs to clients.</p></div><div class="panel"><h3>Buying less, learning more</h3><p>A suitable practice unit can cover several lessons. Check the hairline and nape before a ponytail, parting space before half-up styling, and density before a sculptural bun.</p><p class="small">Tutorial sponsorships are not a shopping list. Buy by function and compatibility.</p></div></div></div>`;}
function journal(){const count=LESSONS.filter(l=>state.answers[l.id]===l.correct).length;return `<div class="intro"><p class="eyebrow">Your practice record</p><h1>See how far you’ve come.</h1><p class="muted">${completed()} lessons practised · ${count} quick checks answered correctly. Progress records practice, not professional certification.</p></div><div class="panel">${LESSONS.some(l=>state.done[l.id]||state.notes[l.id])?LESSONS.filter(l=>state.done[l.id]||state.notes[l.id]).map(l=>`<article class="journal-entry"><div class="row"><h3><a href="#lesson/${l.id}">${l.number}. ${esc(l.title)}</a></h3><span class="badge ${state.done[l.id]?'done':''}">${state.done[l.id]?'Practised':'In progress'}</span></div><p>${esc(state.notes[l.id]||'No notes yet. Open the lesson to add your observations.')}</p></article>`).join(''):'<div class="empty"><h3>Your first practice starts here</h3><p>Open a lesson, make notes and tick it when you have tried it.</p><a class="button" href="#lesson/kit">Start lesson 1 →</a></div>'}</div><details><summary>A simple repeatable quality check</summary><p>1. Comfortable fit. 2. Neat hairline and parting. 3. Balanced shape from all angles. 4. Secure hold during gentle movement. 5. Clear removal and aftercare instructions.</p><p>Keep practice photos on your device. This pack saves text notes only.</p></details>`;}
function bridal(){return `<div class="intro"><p class="eyebrow">Your first complete rehearsal</p><h1>Plan the bridal look.</h1><p class="muted">Use a practice name rather than a client’s private details. Agree the look at a trial, then record the changes.</p></div><div class="split">${Object.entries(FIELDS).map(([k,label])=>`<div class="panel"><label for="bride-${k}">${esc(label)}</label><textarea id="bride-${k}" data-bride="${k}" maxlength="10000" placeholder="Add your plan…">${esc(state.bridal[k]||'')}</textarea></div>`).join('')}</div><p class="small" id="planner-saved" role="status">Changes save in this browser. Back up before moving to another device.</p><div class="actions"><button id="print" class="quiet">Print this plan</button><a class="button" href="#lesson/bridalrun">Open the rehearsal lesson →</a></div>`;}
function sources(){return `<div class="intro"><p class="eyebrow">Sources & practical help</p><h1>Made for learning.</h1><p>17 selected public YouTube videos accompany original short study notes. Titles, creators and accessible video pages were checked in September 2026. Selection used visible video details and available previews, not a complete expert review of every minute.</p><p>Some videos include sponsorships, optional chemicals or extra techniques. Follow the lesson’s scope and the exact product instructions. The pack is a study aid; hands-on feedback remains valuable.</p></div><div class="split"><section class="panel"><h2>Ghana service signals</h2><ul class="source-list"><li>${ext('https://studio623gh.com/services/wigs-frontal-closure/','Studio 623, Accra: wigs, frontals and closures')}</li><li>${ext('https://twinklesbeauty.co/wig-installation-maintenance/','Twinkles Beauty, Accra: installation and maintenance')}</li></ul><p class="small">Service menus indicate what salons offer. They do not establish booking volume or a national demand ranking.</p><h2>Bridal 2026 inspiration</h2><p>${ext('https://www.whowhatwear.com/beauty/hair/wedding-hair-trends-2026','Who What Wear: wedding hair trends for 2026')}</p><p class="small">International inspiration, interpreted as a practice shortlist for Ghana. Established technique videos can teach a current look even if uploaded earlier.</p></section><section class="panel"><h2>Fibre care references</h2><ul class="source-list"><li>${ext('https://www.hairuwear.com/hair-care-and-styling/','HairUWear: hair care and styling')}</li><li>${ext('https://jonrenau.com/blog/synthetic-hair-care-101/','Jon Renau: synthetic hair care')}</li></ul><h2>Saving your work</h2><p>Notes, quiz answers and checklists are stored locally in this browser. They are not sent to a server and do not automatically sync with YouTube or another device.</p><p>Use <strong>Back up progress</strong> to download a JSON file. Use <strong>Restore progress</strong> to merge a backup into this browser. Existing notes are preserved; imported text fills empty fields.</p><p class="small">Keep using the same file location and browser. Browser clearing, private mode or moving the file can affect saved progress. YouTube videos and thumbnails need internet; the written guides work offline.</p></section></div><details><summary>Video credits and direct links</summary><ol>${LESSONS.map(l=>`<li>${ext('https://www.youtube.com/watch?v='+l.video,l.videoTitle)}<br><span class="small">${esc(l.creator)}</span></li>`).join('')}</ol></details>`;}
function render(){let route=location.hash.slice(1)||'learn';if(route==='main')route='learn';const l=route.startsWith('lesson/')?LESSONS.find(v=>v.id===route.split('/')[1]):null;const active=l?'learn':route;document.querySelectorAll('[data-nav]').forEach(a=>{a.removeAttribute('aria-current');if(a.dataset.nav===active)a.setAttribute('aria-current','page');});$('#main').innerHTML=l?lesson(l):({learn,kit,journal,bridal,sources}[route]||learn)();document.title=(l?l.title:({learn:'Learn',kit:'Hair & tools',journal:'My practice',bridal:'Bridal planner',sources:'Sources & help'}[route]||'Learn'))+' | Sandy';if($('#lesson-grid')){cards();$('#search').addEventListener('input',e=>{query=e.target.value;cards();});$('#group').addEventListener('change',e=>{group=e.target.value;cards();});$('#status').addEventListener('change',e=>{status=e.target.value;cards();});}if(l){feedback(l);$('#quiz').addEventListener('submit',e=>{e.preventDefault();const chosen=new FormData(e.target).get('answer');if(chosen===null){notify('Choose an answer first.');return;}state.answers[l.id]=Number(chosen);save();feedback(l);});$('#done').addEventListener('change',e=>{state.done[l.id]=e.target.checked;save();notify(e.target.checked?'Practice recorded. Well done, keep refining it.':'Lesson marked for more practice.');});$('#notes').addEventListener('input',e=>{state.notes[l.id]=e.target.value;save();$('#note-saved').textContent=storageOK?'Saved':'Back up needed';});document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('change',()=>{state.checks[el.dataset.step]=el.checked;save();}));}document.querySelectorAll('[data-kit]').forEach(el=>el.addEventListener('change',()=>{state.kit[KIT[Number(el.dataset.kit)]]=el.checked;save();}));document.querySelectorAll('[data-bride]').forEach(el=>el.addEventListener('input',()=>{state.bridal[el.dataset.bride]=el.value;save();$('#planner-saved').textContent=storageOK?'Saved in this browser.':'Saving unavailable. Back up progress before closing.';}));$('#print')?.addEventListener('click',()=>window.print());}
$('#backup').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sandy-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Progress backup downloaded. Keep it somewhere safe.');});
$('#restore').addEventListener('click',()=>$('#restore-file').click());
$('#restore-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('Too large');const incoming=validate(JSON.parse(await f.text()));for(const k of ['done','checks','kit'])for(const [id,v]of Object.entries(incoming[k]))if(v)state[k][id]=v;for(const k of ['notes','bridal','answers'])for(const [id,v]of Object.entries(incoming[k]))if(state[k][id]===undefined||state[k][id]==='')state[k][id]=v;save();render();notify('Backup merged. Existing notes were kept.');}catch(err){notify('This is not a valid Sandy progress backup. Your current work is unchanged.');}e.target.value='';});
addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});render();if(!storageOK)notify('Saved progress could not be loaded. Keep regular backups.');
</script></body></html>
